#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "microbin"
name = "MicroBin"
description.en = "Configurable file-sharing and URL shortening web app"
description.fr = "Partage de fichiers et de raccourcissement d'URL"

version = "2.1.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "BSD-3-Clause"
website = "https://microbin.eu/"
demo = "https://pub.microbin.eu/"
code = "https://github.com/szabodanika/microbin"
fund = "https://ko-fi.com/dani_sz"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/szabodanika/microbin/releases/download/v2.1.2/microbin-v2.1.2-x86_64-unknown-linux-musl.tar.gz"
    amd64.sha256 = "b2ec96c798f33aec28ca6dffa90c02ab69113ff135a68029e560622681744bac"
    arm64.url = "https://github.com/szabodanika/microbin/releases/download/v2.1.2/microbin-v2.1.2-aarch64-unknown-linux-musl.tar.gz"
    arm64.sha256 = "13f6b4e567e16c245351167a09b50870d69c521507937f2575bb68bedc7012e3"
    armhf.url = "https://github.com/szabodanika/microbin/releases/download/v2.1.2/microbin-v2.1.2-armv7-unknown-linux-musleabihf.tar.gz"
    armhf.sha256 = "3995130491f79b839ebb1f684b919c5cfb9dd6aa4bfed6494b2e9fc9e0e4ef56"
    i386.url = "https://github.com/szabodanika/microbin/releases/download/v2.1.2/microbin-v2.1.2-i686-unknown-linux-musl.tar.gz"
    i386.sha256 = "9ea39745622f975365c229148cc2ca927eda5c0a605332ccc9b4792d1cac44df"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*-x86_64-unknown-linux-musl.tar.gz"
    autoupdate.asset.arm64 = ".*-aarch64-unknown-linux-musl.tar.gz"
    autoupdate.asset.armhf = ".*-armv7-unknown-linux-musleabihf.tar.gz"
    autoupdate.asset.i386 = ".*-i686-unknown-linux-musl.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
